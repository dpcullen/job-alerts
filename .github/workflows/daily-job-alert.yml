name: Daily Job Alert
# v2

on:
  schedule:
    # Target: ~6 AM PDT. GitHub free tier runs ~2hrs late, so scheduling at 11:00 UTC
    # (4 AM PDT) to compensate. Arrives ~6 AM PDT / ~5 AM PST in winter.
    - cron: '0 11 * * *'
  workflow_dispatch:  # Allows manual "Run workflow" from the GitHub UI

concurrency:
  group: job-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python job_alert.py

      - name: Save seen jobs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "chore: update seen jobs [skip ci]"
          git push
